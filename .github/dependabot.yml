version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    assignees:
      - 'maguru-admin'
    reviewers:
      - 'maguru-devops'
    allow:
      - dependency-type: 'all'
    ignore:
      - dependency-name: 'actions/checkout'
        versions: ['3.x'] # Pertahankan v4
      - dependency-name: 'actions/setup-node'
        versions: ['3.x'] # Pertahankan v4

  # Maintain dependencies for npm (yarn)
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Jakarta'
    labels:
      - 'dependencies'
      - 'npm'
    versioning-strategy: increase
    commit-message:
      prefix: 'dep'
      include: 'scope'
    assignees:
      - 'maguru-admin'
    reviewers:
      - 'maguru-dev'
    allow:
      - dependency-type: 'direct'
    open-pull-requests-limit: 5
    groups:
      core-framework:
        patterns:
          - 'next'
          - '@next/*'
          - 'react'
          - 'react-dom'
        update-types:
          - 'minor'
          - 'patch'
      ui-components:
        patterns:
          - '@radix-ui/*'
          - 'lucide-react'
          - 'tailwind*'
          - '@tailwindcss/*'
        update-types:
          - 'minor'
          - 'patch'
      testing:
        patterns:
          - '@testing-library/*'
          - 'jest*'
          - '@types/jest'
          - '@playwright/*'
          - 'msw'
        update-types:
          - 'minor'
          - 'patch'
      database:
        patterns:
          - '@prisma/*'
          - 'prisma'
        update-types:
          - 'minor'
          - 'patch'
      development-tools:
        patterns:
          - '@typescript-eslint/*'
          - 'eslint*'
          - 'prettier'
          - 'typescript'
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
