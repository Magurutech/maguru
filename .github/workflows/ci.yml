name: Code Quality Checks

# Trigger: Setiap push untuk fast feedback
on:
  push:
    branches: [develop, main, 'feature/*']  # Semua branches
  workflow_dispatch:  # Manual trigger

# Set environment variables
env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: development
  CI: true

jobs:
  # Job 1: ESLint
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          echo "✅ Dependencies installed successfully" ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        env:
          SKIP_ENV_VALIDATION: true
        run: |
          echo "=== Installing dependencies ==="
          yarn install --frozen-lockfile || yarn install
          echo "✅ Dependencies installed"

      - name: Run ESLint
        run: |
          echo "=== Running ESLint ==="
          yarn lint
          echo "✅ Linting completed"

      - name: Upload ESLint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-results-${{ github.sha }}
          path: |
            .eslintcache
            eslint_report.json
          retention-days: 3

  # Job 2: TypeScript Type Check
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        env:
          SKIP_ENV_VALIDATION: true
        run: |
          echo "=== Installing dependencies ==="
          yarn install --frozen-lockfile || yarn install
          echo "✅ Dependencies installed"

      - name: Run TypeScript type check
        run: |
          echo "=== Running TypeScript type check ==="
          yarn type-check
          echo "✅ Type check completed"

      - name: Create summary
        if: always()
        run: |
          echo "### TypeScript Type Check Results 📝" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ No type errors found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Type errors detected" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 3: Summary
  quality-check-summary:
    name: Quality Check Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "### Code Quality Check Summary 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Action Required:** Fix code quality issues before merging" >> $GITHUB_STEP_SUMMARY
          name: unit-test-coverage
          p exit 1
          fi